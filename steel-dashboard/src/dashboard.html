        notify("info", "הטיוטה נשמרה לקובץ " + esc(name) + ".");
      }).catch(function (e) {
        if (e && e.code === "declined") return;
        notify("error", "השמירה לקובץ לא הצליחה. הטיוטה עדיין שמורה כאן.");
      });
      return;
    }
    if (!window.claude) { downloadLocal(name, text, "application/json"); return; }
    try {
      navigator.clipboard.writeText(text).then(function () {
        notify("info", "הורדת קבצים לא זמינה כאן, אז הטיוטה הועתקה. אפשר להדביק לקובץ טקסט בשם " + esc(name) + ".");
      }, function () { notify("error", "השמירה לקובץ לא זמינה כאן."); });
    } catch (e) { notify("error", "השמירה לקובץ לא זמינה כאן."); }
  }
  function loadDraftFile(file) {
    file.text().then(function (text) {
      var data = JSON.parse(text);
      if (!data || data.type !== DRAFT_TYPE) throw new Error("not a draft");
      applyDraft(data);
      render();
      clearTimeout(saveTimer);
      doSave();
      var when = data.savedAt ? new Date(data.savedAt).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" }) : "";
      var older = data.stockRun && state.snap && data.stockRun !== state.snap.meta.stockRun;
      notify("info", "נטענה טיוטה" + (when ? " מ־" + esc(when) : "") + "." + (older ? " היא נבנתה על נתוני מלאי מ־" + esc(data.stockRun) + ", אז ההמלצות לצידה עודכנו לנתונים הנוכחיים." : ""));
    }).catch(function () {
      notify("error", "הקובץ הזה לא טיוטת הזמנה מהלוח. בוחרים קובץ .json שנשמר בכפתור \"שמירת טיוטה לקובץ\".");
    });
  }

  // ---------- export ----------
  function exportRows() {
    var out = [];
    if (!state.plan) return out;
    state.plan.groups.forEach(function (g) {
      g.rows.forEach(function (r) {
        var q = qtyOf(r);
        if (q <= 0) return;
        var x = r.item, p = state.params[x.material] || {};
        out.push([x.sku, x.desc, g.profile.name, x.lengthM ? x.lengthM + " מ׳" : "", MAT[x.material] || x.material, x.family,
          Math.round(q), q / 1000, r.price ? Math.round(r.price) : "", r.price ? Math.round(q / 1000 * r.price) : "",
          r.lastSupplier || "", p.arrival || "", p.until || ""]);
      });
    });
    return out;
  }
  var EXPORT_HEAD = ["מק״ט", "תיאור", "פרופיל", "אורך", "חומר", "משפחה", "כמות ק״ג", "כמות טון", "מחיר משוער $ לטון", "סכום משוער $", "ספק אחרון", "חודש הגעה", "להחזיק עד"];
  function toDelimited(rows, sep) {
    return [EXPORT_HEAD].concat(rows).map(function (r) {
      return r.map(function (v) {
        var s = String(v);
        return sep === "," && /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s.replace(/\t/g, " ");
      }).join(sep);
    }).join("\r\n");
  }
  function notify(type, html) { state.notice = { type: type, html: html }; renderNotice(); }
  function doExport() {
    var rows = exportRows();
    if (!rows.length) { notify("info", "אין שורות עם כמות להזמנה."); return; }
    var csv = "﻿" + toDelimited(rows, ",");
    var name = "steel-import-order-" + state.d.refDate + ".csv";
    if (cap.downloads) {
      cap.downloads.save({ filename: name, data: csv }).then(function () {
        notify("info", "הקובץ ירד: " + rows.length + " שורות.");
      }).catch(function (e) {
        if (e && e.code === "declined") return;
        notify("error", "ההורדה לא הצליחה. אפשר ללחוץ \"העתקה\" ולהדביק באקסל.");
      });
      return;
    }
    if (!window.claude) { downloadLocal(name, csv, "text/csv;charset=utf-8"); return; }
    doCopy();
  }
  function doCopy() {
    var rows = exportRows();
    if (!rows.length) { notify("info", "אין שורות עם כמות להזמנה."); return; }
    var tsv = toDelimited(rows, "\t");
    var ok = function () { notify("info", "הועתקו " + rows.length + " שורות. אפשר להדביק באקסל."); };
    try {
      navigator.clipboard.writeText(tsv).then(ok, function () { fallbackCopy(tsv); ok(); });
    } catch (e) { fallbackCopy(tsv); ok(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }

  // ---------- render ----------
  function render() {
    renderStamps();
    renderMatSeg();
    renderViews();
    renderNotice();
    var main = document.getElementById("main");
    tables = {};
    if (!state.snap) { state.d = null; main.innerHTML = emptyState(); return; }
    var d;
    try { d = M.compute(state.snap, { material: state.material, excludeWh: state.excludeWh, leadMonths: state.leadMonths }); }
    catch (e) {
      state.d = null;
      main.innerHTML = '<div class="notice error">החישוב נכשל: ' + esc(e.message) + "</div>";
      return;
    }
    state.d = d;
    main.innerHTML = state.view === "order" ? renderOrder(d) : renderBoard(d);
  }

  // ---------- loading files ----------
  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    var drafts = files.filter(function (f) { return /\.json$/i.test(f.name); });
    if (drafts.length) loadDraftFile(drafts[0]);
    files = files.filter(function (f) { return !/\.json$/i.test(f.name); });
    if (!files.length) return;
    Promise.all(files.map(function (f) {
      return f.arrayBuffer().then(function (b) { return { name: f.name, text: M.decode(b) }; });
    })).then(function (results) {
      var unknown = [];
      results.forEach(function (r) {
        var kind = M.detectKind(M.parseTsv(r.text.slice(0, 4000)).header);
        if (kind) state.pending[kind] = r; else unknown.push(r.name);
      });
      var missing = Object.keys(KIND).filter(function (k) { return !state.pending[k]; });
      if (missing.length) {
        notify(unknown.length ? "error" : "info",
          (unknown.length ? "לא זיהיתי את " + unknown.map(esc).join(", ") + ". " : "") + "חסרים עוד: " + missing.map(function (k) { return KIND[k]; }).join(", ") + ".");
        return;
      }
      var snap = M.extract([state.pending.parts.text, state.pending.stock.text, state.pending.orders.text]);
      state.pending = {};
      state.snap = snap; state.source = "upload"; state.loadedAt = new Date().toISOString();
      var kept = save("upload", { snap: snap, loadedAt: state.loadedAt });
      state.notice = { type: "info", html: "נטענו נתונים חדשים: מלאי מ־" + esc(snap.meta.stockRun) + ", " + nf0.format(snap.parts.length) + " מק״טים." + (kept ? "" : " הדפדפן לא שמר אותם, אז בטעינה הבאה יוצגו נתוני הדוח המקוריים.") };
      render();
    }).catch(function (e) {
      state.pending = {};
      notify("error", "לא הצלחתי לקרוא את הקבצים: " + esc(e.message) + ". ודאו שאלה ייצואים מפריוריטי בפורמט טקסט עם טאבים.");
    });
  }

  // ---------- events ----------
  var fileInput = document.getElementById("file-input");
  fileInput.addEventListener("change", function () { handleFiles(fileInput.files); fileInput.value = ""; });
  var draftInput = document.getElementById("draft-input");
  draftInput.addEventListener("change", function () { if (draftInput.files[0]) loadDraftFile(draftInput.files[0]); draftInput.value = ""; });
  window.addEventListener("hashchange", function () {
    var v = location.hash === "#order" ? "order" : "board";
    if (v !== state.view) { state.view = v; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener("click", function (e) {
    var t = e.target;
    var el;
    if ((el = t.closest("#load-btn, [data-load]"))) { fileInput.click(); return; }
    if ((el = t.closest("[data-reset]"))) { drop("upload"); state.notice = null; pickSource(); render(); return; }
    if ((el = t.closest("a[data-view]"))) {
      var v = el.getAttribute("data-view");
      if (v !== state.view) { state.view = v; render(); window.scrollTo(0, 0); }
      return;
    }
    if ((el = t.closest("[data-mat]"))) { state.material = el.getAttribute("data-mat"); save("material", state.material); render(); return; }
    if ((el = t.closest("[data-tab]"))) {
      state.tab = el.getAttribute("data-tab"); save("tab", state.tab);
      var sec = document.getElementById("attention");
      if (sec && state.d) sec.outerHTML = attention(state.d);
      var btn = document.getElementById("tab-" + state.tab); if (btn) btn.focus();
      return;
    }
    if ((el = t.closest("th[data-sort]"))) {
      var id = el.closest("[data-table]").getAttribute("data-table");
      var key = el.getAttribute("data-sort");
      var def = tables[id];
      var col = def.cols.filter(function (c) { return c.key === key; })[0];
      var cur = state.sorts[id] || def.opt.sort;
      state.sorts[id] = { key: key, dir: cur && cur.key === key ? -cur.dir : (col.num ? -1 : 1) };
      repaintTable(id);
      return;
    }
    if ((el = t.closest("[data-more]"))) { var mid = el.getAttribute("data-more"); state.limits[mid] = 100000; repaintTable(mid); return; }
    if ((el = t.closest("[data-bucket]"))) { var b = el.getAttribute("data-bucket"); state.bucket = b && state.bucket !== b ? b : null; repaintExplorer(false); return; }
    if ((el = t.closest("[data-family]"))) { state.family = el.getAttribute("data-family"); state.bucket = null; state.q = ""; repaintExplorer(true); return; }
    if ((el = t.closest("[data-po]"))) {
      var po = el.getAttribute("data-po"); state.poOpen[po] = !state.poOpen[po];
      var o = document.getElementById("orders"); if (o && state.d) o.outerHTML = poTable(state.d);
      return;
    }
    if ((el = t.closest("[data-export]"))) { doExport(); return; }
    if ((el = t.closest("[data-draft-save]"))) { saveDraftFile(); return; }
    if ((el = t.closest("[data-draft-load]"))) { draftInput.click(); return; }
    if ((el = t.closest("[data-scroll]"))) {
      var target = document.getElementById(el.getAttribute("data-scroll"));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if ((el = t.closest("[data-copy]"))) { doCopy(); return; }
    if ((el = t.closest("[data-reset-order]"))) {
      state.overrides = {}; scheduleSave(); repaintOrderTable(); repaintTotals();
      notify("info", "הכמויות חזרו להמלצה.");
      return;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = e.target.closest && e.target.closest("tr[data-family], tr[data-po]");
    if (el) { e.preventDefault(); el.click(); }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!state.d) return;
    if (t.id === "q") {
      state.q = t.value;
      var box = document.getElementById("explorer-table");
      if (box) box.innerHTML = explorerTable(state.d);
      return;
    }
    if (t.id === "oq") { state.ofilter.q = t.value; repaintOrderTable(); return; }
    if (t.classList.contains("qty")) {
      var sku = t.getAttribute("data-sku");
      var v = parseFloat(t.value);
      state.overrides[sku] = isFinite(v) && v > 0 ? Math.round(v * 1000) : 0;
      var row = null, grp = null;
      state.plan.groups.some(function (g) {
        return g.rows.some(function (r) { if (r.item.sku === sku) { row = r; grp = g; return true; } return false; });
      });
      if (row) {
        t.classList.toggle("changed", state.overrides[sku] !== row.rec);
        var cell = document.getElementById("usd-" + sku);
        var q = qtyOf(row);
        if (cell) cell.innerHTML = q > 0 && row.price ? money(q / 1000 * row.price, "$") : DOT;
        var gq = 0, gu = 0;
        grp.rows.forEach(function (r) { var qq = qtyOf(r); gq += qq; if (r.price) gu += qq / 1000 * r.price; });
        var c1 = document.getElementById("gq-" + grp.profile.key); if (c1) c1.innerHTML = gq > 0 ? "<b>" + tons(gq) + " ט׳</b>" : "";
        var c2 = document.getElementById("gu-" + grp.profile.key); if (c2) c2.innerHTML = gu > 0 ? money(gu, "$") : "";
      }
      repaintTotals();
      scheduleSave();
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!state.d) return;
    if (t.id === "fam") {
      state.family = t.value;
      var box = document.getElementById("explorer-table");
      if (box) box.innerHTML = explorerTable(state.d);
      return;
    }
    if (t.hasAttribute("data-wh")) {
      var wh = t.getAttribute("data-wh");
      state.excludeWh = state.excludeWh.filter(function (w) { return w !== wh; });
      if (!t.checked) state.excludeWh.push(wh);
      save("excludeWh", state.excludeWh);
      render();
      return;
    }
    if (t.id === "ofam") { state.ofilter.family = t.value; repaintOrderTable(); return; }
    if (t.id === "lead") {
      state.leadMonths = +t.value;
      state.params = null; // arrival months follow the new lead time
      render();
      clearTimeout(saveTimer);
      doSave();
      var lead = document.getElementById("lead"); if (lead) lead.focus();
      return;
    }
    if (t.id === "oall") { state.ofilter.all = t.checked; repaintOrderTable(); return; }
    if (t.hasAttribute("data-param")) {
      var parts = t.getAttribute("data-param").split(":");
      var p = state.params[parts[0]];
      p[parts[1]] = parts[1] === "stepKg" ? +t.value : t.value;
      if (p.until <= p.arrival) p.until = M.addMonths(p.arrival, 3);
      clearTimeout(saveTimer);
      doSave();
      render();
      var again = document.getElementById(t.id); if (again) again.focus();
    }
  });

  // tooltip for the arrivals chart
  var tip = document.getElementById("tip");
  document.addEventListener("mousemove", function (e) {
    var hit = e.target.closest && e.target.closest("#arr-chart [data-i]");
    if (!hit || !state.arrCats) { tip.hidden = true; return; }
    var c = state.arrCats[+hit.getAttribute("data-i")];
    tip.innerHTML = arrivalTip(c);
    tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, y) + "px";
  });

  // drag and drop anywhere on the page
  window.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", function (e) { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); document.body.classList.remove("dragging");
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });

  // Leaving before the debounce fires still keeps the latest edits.
  window.addEventListener("pagehide", function () {
    if (!saveTimer) return;
    clearTimeout(saveTimer); saveTimer = null;
    doSave();
  });

  pickSource();
  initCapabilities();
  render();
})();
</script>
<!--@/body-->
